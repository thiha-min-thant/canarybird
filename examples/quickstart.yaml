# The simplest possible demo: two versions behind ONE Service.
# 3 × v1 and 1 × v2 pods → the endpoint slice gives roughly a 75/25 split.
# Watch it on the grid, then scale either Deployment and watch the split move.
#
#   kubectl apply -f examples/quickstart.yaml
#   kubectl port-forward svc/canarybird 8080:80
#   open http://localhost:8080      # Traffic panel → Expected split: v1=75,v2=25
#   kubectl scale deploy/canarybird-v2 --replicas=3   # → 50/50
---
apiVersion: v1
kind: Service
metadata:
  name: canarybird
spec:
  selector:
    app: canarybird
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: canarybird-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: canarybird
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarybird-v1
spec:
  replicas: 3
  selector:
    matchLabels: { app: canarybird, version: v1 }
  template:
    metadata:
      labels: { app: canarybird, version: v1 }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: canarybird
          image: ghcr.io/thiha-min-thant/canarybird:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: VERSION, value: v1 }
            - { name: COLOR, value: blue }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: LOADGEN_ENABLED, value: "true" }
            - { name: LOADGEN_RPS, value: "30" }
            - { name: LOADGEN_TARGET, value: http://canarybird }
            - { name: CONTROL_PEERS, value: canarybird-headless }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 3, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarybird-v2
spec:
  replicas: 1
  selector:
    matchLabels: { app: canarybird, version: v2 }
  template:
    metadata:
      labels: { app: canarybird, version: v2 }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: canarybird
          image: ghcr.io/thiha-min-thant/canarybird:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: VERSION, value: v2 }
            - { name: COLOR, value: green }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: LOADGEN_ENABLED, value: "true" }
            - { name: LOADGEN_RPS, value: "30" }
            - { name: LOADGEN_TARGET, value: http://canarybird }
            - { name: CONTROL_PEERS, value: canarybird-headless }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 3, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 512Mi } }
