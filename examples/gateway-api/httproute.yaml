# Gateway API weighted split, 90/10 between two Deployments. Uses the stable
# and canary Services from examples/quickstart.yaml, split per version.
# Point the Traffic panel at the Gateway (e.g. http://canarybird-gw) and set
# Expected split to v1=90,v2=10 — then compare with what the grid observes.
---
apiVersion: v1
kind: Service
metadata: { name: canarybird-v1 }
spec:
  selector: { app: canarybird, version: v1 }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: canarybird-v2 }
spec:
  selector: { app: canarybird, version: v2 }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canarybird
spec:
  parentRefs:
    - name: my-gateway          # your Gateway
  hostnames: [canarybird.example.com]
  rules:
    - backendRefs:
        - name: canarybird-v1
          port: 80
          weight: 90
        - name: canarybird-v2
          port: 80
          weight: 10
