apiVersion: v1
kind: Service
metadata:
  name: {{ include "canarybird.fullname" . }}
  labels:
    {{- include "canarybird.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "canarybird.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
# Headless Service: resolves to every pod IP so /control can fan out.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "canarybird.fullname" . }}-headless
  labels:
    {{- include "canarybird.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # a pod in the not-ready scenario must still take a "heal" command
  selector:
    {{- include "canarybird.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
