apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canarybird.fullname" . }}
  labels:
    {{- include "canarybird.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "canarybird.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "canarybird.selectorLabels" . | nindent 8 }}
        canarybird.dev/version: {{ .Values.version | quote }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: canarybird
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERSION
              value: {{ .Values.version | quote }}
            - name: COLOR
              value: {{ .Values.color | quote }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: LOADGEN_ENABLED
              value: {{ .Values.loadgen.enabled | quote }}
            - name: LOADGEN_RPS
              value: {{ .Values.loadgen.rps | quote }}
            - name: LOADGEN_KEEPALIVE
              value: {{ .Values.loadgen.keepalive | quote }}
            - name: LOADGEN_TARGET
              value: {{ include "canarybird.loadgenTarget" . | quote }}
            {{- if .Values.controlPeers }}
            - name: CONTROL_PEERS
              value: {{ printf "%s-headless.%s.svc" (include "canarybird.fullname" .) .Release.Namespace | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
